name: securite
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tout l'historique
      - name: Gitleaks sur tout l'historique
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --report-format json --report-path /repo/gitleaks.json
      - uses: actions/upload-artifact@v7
        if: always()              # conserver le rapport même en échec
        with:
          name: rapport-gitleaks
          path: gitleaks.json

  sast:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v7
      - name: Analyse statique
        run: semgrep scan --config p/javascript --metrics=off --error --json --output semgrep.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-semgrep
          path: semgrep.json
